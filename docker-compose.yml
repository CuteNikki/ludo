services:
  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    restart: unless-stopped
    networks:
      - arr-network
    labels:
      homepage.group: 'Infrastructure'
      homepage.name: 'Ludo Backend'
      homepage.icon: 'mdi-server'
      homepage.href: 'https://ludo.niso.moe'

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        - NEXT_PUBLIC_WS_URL=wss://ludo.niso.moe/ws
        - NEXT_PUBLIC_SITE_URL=https://ludo.niso.moe
        - NEXT_PUBLIC_LEGAL_NAME=${LEGAL_NAME:-}
        - NEXT_PUBLIC_LEGAL_ADDRESS=${LEGAL_ADDRESS:-}
        - NEXT_PUBLIC_LEGAL_EMAIL=${LEGAL_EMAIL:-}
        - NEXT_PUBLIC_LEGAL_PHONE=${LEGAL_PHONE:-}
    restart: unless-stopped
    depends_on:
      - server
    networks:
      - arr-network
    labels:
      homepage.group: 'Infrastructure'
      homepage.name: 'Ludo Frontend'
      homepage.icon: 'mdi-controller'
      homepage.href: 'https://ludo.niso.moe'

networks:
  arr-network:
    external: true
    name: arr-stack_default
