services:
  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    # Named, so the server's Caddy can reach it as ludo-server
    container_name: ludo-server
    restart: unless-stopped
    networks:
      - arr-network

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        - NEXT_PUBLIC_WS_URL=wss://ludo.niso.moe/ws
        - NEXT_PUBLIC_SITE_URL=https://ludo.niso.moe
        - NEXT_PUBLIC_LEGAL_NAME=${LEGAL_NAME:-}
        - NEXT_PUBLIC_LEGAL_ADDRESS=${LEGAL_ADDRESS:-}
        - NEXT_PUBLIC_LEGAL_EMAIL=${LEGAL_EMAIL:-}
        - NEXT_PUBLIC_LEGAL_PHONE=${LEGAL_PHONE:-}
    container_name: ludo-web
    restart: unless-stopped
    depends_on:
      - server
    networks:
      - arr-network

networks:
  arr-network:
    external: true
    name: arr-stack_default
