services:
  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    ports:
      - '127.0.0.1:3001:3001'
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        - NEXT_PUBLIC_WS_URL=wss://ludo.niso.moe/ws
    ports:
      - '127.0.0.1:3002:3000'
    restart: unless-stopped
    depends_on:
      - server
